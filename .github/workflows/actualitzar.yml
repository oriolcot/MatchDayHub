name: Actualitzar Futbol

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar el codi
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Instal·lar llibreries
        run: pip install requests beautifulsoup4 cloudscraper

      - name: 🚀 GENERAR WEB
        env:
          API_URL: ${{ secrets.API_URL }}
        run: python generator.py > index.html

      - name: 💾 Guardar i Pujar
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add index.html memoria_partits.json
          git commit -m "Auto-update ⚽ + 🏀" || echo "Sense canvis nous"
          git push